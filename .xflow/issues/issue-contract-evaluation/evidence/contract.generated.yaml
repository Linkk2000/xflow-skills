preconditionsToResolve:
  - id: xflow.question.bootstrap-source-access
    version: 0.1.0
    question: 在离线新电脑上由哪个已批准来源提供首次 bootstrap 所需的精确工具内容
    requiredBefore: implementation
    status: open
    decision: 当前契约要求每工具受信任且可访问的 source、expectedRef和resolvedCommit；不可访问时停止并请求来源，不回退到公共搜索、全局安装或临时开发目录
  - id: xflow.question.remote-repository-provider-details
    version: 0.1.0
    question: 远端存在时各 Git 提供方的只读检查和人工审核界面如何实现
    requiredBefore: implementation
    status: deferred
    decision: 仅在provider-specific implementation或adapter前需要；不阻塞当前通用本地语义或engineering projection，任何远端写入仍由独立人工门阻止
futureCapabilitiesOutOfScope:
  - id: xflow.future.machine-prerequisite-installation
    version: 0.1.0
    capability: 自动安装 Git、Python 或其他机器级软件
    reason: 启用项目能力不授予机器级包管理权限
  - id: xflow.future.automatic-conflict-overwrite
    version: 0.1.0
    capability: 自动覆盖项目规则、代码、配置、Issue资料、工具目录或wrapper冲突
    reason: 冲突必须保留原状并由人工决策
  - id: xflow.future.unreviewed-development-or-remote-write
    version: 0.1.0
    capability: 未经独立人工门的开发、Issue、契约验收、commit、push 或 PR/MR
    reason: 启用和恢复不替代后续工作流状态或人类授权
